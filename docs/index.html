<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>金融投研智能体 · 可核验审计台</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>金融投研智能体</h1>
  <p class="sub">研究报告纠错核查 · 表格 + 点击溯源 + 审计日志 —— 每个结论都能指回原文第几页</p>
</header>

<nav id="tabs">
  <button data-tab="materials" class="active">材料台账</button>
  <button data-tab="evidence">证据与溯源</button>
  <button data-tab="checks">陈述核查</button>
  <button data-tab="events">审计日志</button>
</nav>

<main>
  <!-- 材料台账 -->
  <section id="tab-materials" class="tab active">
    <div class="bar">
      <span id="mat-count"></span>
      <input id="mat-filter" placeholder="搜索代码 / 公司 / 年份…" />
    </div>
    <table class="grid" id="mat-table">
      <thead><tr>
        <th>代码</th><th>公司</th><th>年度</th><th>标题</th>
        <th>公告 ID</th><th>页数</th><th>指纹 sha256</th>
      </tr></thead>
      <tbody></tbody>
    </table>
  </section>

  <!-- 证据与溯源 -->
  <section id="tab-evidence" class="tab">
    <div class="split">
      <div class="left">
        <div class="bar">
          <span id="ev-count"></span>
          <select id="ev-company"></select>
          <select id="ev-metric"></select>
        </div>
        <table class="grid" id="ev-table">
          <thead><tr>
            <th>公司</th><th>指标</th><th>年度</th><th>数值</th><th>单位</th><th>页</th><th>口径</th>
          </tr></thead>
          <tbody></tbody>
        </table>
      </div>
      <div class="right">
        <div class="bar"><span id="src-title">点击左侧任意一行 → 定位原文</span></div>
        <div id="src-view">
          <div class="placeholder">左表选中一行后，这里显示证据所在页并高亮数值单元格</div>
        </div>
      </div>
    </div>
  </section>

  <!-- 陈述核查 -->
  <section id="tab-checks" class="tab">
    <div class="bar"><span id="ck-count"></span></div>
    <table class="grid" id="ck-table">
      <thead><tr>
        <th>编号</th><th>原句</th><th>核查项</th><th>结果</th><th>原因 / 程序建议</th><th>证据与页码</th>
      </tr></thead>
      <tbody></tbody>
    </table>
  </section>

  <!-- 审计日志 -->
  <section id="tab-events" class="tab">
    <div class="bar"><span id="ev2-count"></span></div>
    <table class="grid" id="ev2-table">
      <thead><tr>
        <th>时间</th><th>事件</th><th>详情</th>
      </tr></thead>
      <tbody></tbody>
    </table>
  </section>
</main>

<footer>
  数据来源：巨潮资讯网公开年报 · 第三方（东方财富）仅作交叉验证 ·
  运行留痕见 <code>results/</code> · 源码见 <code>agent/</code>
</footer>

<script src="app.js"></script>
</body>
</html>
